[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_gemm"
version = "0.1.0"
description = "Hygon DCU W8A8 GEMM operators via tilelang (gfx936/gfx928)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MiniMax-M3 quant team"}]
keywords = ["hygon", "dcu", "w8a8", "tilelang", "quantization", "moe"]
dependencies = [
    "torch",
    "tilelang",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_gemm*"]
